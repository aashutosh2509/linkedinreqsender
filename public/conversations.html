<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leads CRM - Conversations</title>
    <link rel="stylesheet" href="admin_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>NBE CRM</span>
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="admin_dashboard.html"><i class="fa-solid fa-house"></i> Overview</a></li>
                <li><a href="admin_dashboard.html#leads"><i class="fa-solid fa-users"></i> Leads</a></li>
                <li class="active"><a href="conversations.html"><i class="fa-solid fa-comments"></i> Conversations</a></li>
                <li><a href="#"><i class="fa-solid fa-gear"></i> Settings</a></li>
            </ul>
            <div class="sidebar-footer" style="display: flex; justify-content: space-between; align-items: center;">
                <div class="user-profile">
                    <div class="avatar">Admin</div>
                    <div class="user-info">
                        <span class="name">Administrator</span>
                        <span class="role">Lead Manager</span>
                    </div>
                </div>
                <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle Light/Dark Mode">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content (Chat Layout) -->
        <main class="main-content chat-layout">
            <div class="chat-sidebar">
                <div class="chat-sidebar-header">
                    <h2>Chats</h2>
                    <div class="search-bar chat-search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="chatSearchInput" placeholder="Search conversations...">
                    </div>
                </div>
                <div class="chat-list" id="chatList">
                    <!-- Populated by JS -->
                </div>
            </div>
            <div class="chat-main" id="chatMain">
                <div class="chat-empty-state">
                    <i class="fa-regular fa-comments"></i>
                    <p>Select a conversation to start reading.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="conversations.js"></script>
    <script>
        // Theme Toggle Logic
        const themeBtns = document.querySelectorAll('.theme-toggle-btn');
        
        function applyTheme(isLight) {
            if (isLight) {
                document.body.classList.add('light-mode');
                themeBtns.forEach(btn => {
                    const icon = btn.querySelector('i');
                    if(icon) {
                        icon.classList.remove('fa-moon');
                        icon.classList.add('fa-sun');
                    }
                });
            } else {
                document.body.classList.remove('light-mode');
                themeBtns.forEach(btn => {
                    const icon = btn.querySelector('i');
                    if(icon) {
                        icon.classList.remove('fa-sun');
                        icon.classList.add('fa-moon');
                    }
                });
            }
        }

        // Load saved preference
        const savedTheme = localStorage.getItem('crm_theme');
        if (savedTheme === 'light') {
            applyTheme(true);
        }

        themeBtns.forEach(themeBtn => {
            themeBtn.addEventListener('click', () => {
                const isLight = !document.body.classList.contains('light-mode');
                applyTheme(isLight);
                localStorage.setItem('crm_theme', isLight ? 'light' : 'dark');
            });
        });
    </script>
</body>
</html>
