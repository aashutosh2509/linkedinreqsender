<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leads CRM - Admin Dashboard</title>
    <link rel="stylesheet" href="admin_style.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>NBE CRM</span>
                </div>
            </div>
            <ul class="nav-links">
                <li class="active" id="nav-overview"><a href="#overview"><i class="fa-solid fa-house"></i> Overview</a></li>
                <li id="nav-leads"><a href="#leads"><i class="fa-solid fa-users"></i> Leads</a></li>
                <li><a href="conversations.html"><i class="fa-solid fa-comments"></i> Conversations</a></li>
                <li><a href="#"><i class="fa-solid fa-gear"></i> Settings</a></li>
            </ul>
            <div class="sidebar-footer" style="display: flex; justify-content: space-between; align-items: center;">
                <div class="user-profile">
                    <div class="avatar">Admin</div>
                    <div class="user-info">
                        <span class="name">Administrator</span>
                        <span class="role">Lead Manager</span>
                    </div>
                </div>

            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search leads by name or company...">
                </div>
                <div class="header-actions">
                    <button class="icon-btn" id="themeToggleBtn"><i class="fa-solid fa-moon"></i></button>
                    <div class="notification-container" style="position: relative;">
                        <button class="icon-btn" id="notifBtn">
                            <i class="fa-regular fa-bell"></i>
                            <span id="notifBadge" class="notif-badge" style="display: none;">0</span>
                        </button>
                        <div id="notifDropdown" class="notif-dropdown" style="display: none;">
                            <div class="notif-header">
                                <h4>Notifications</h4>
                            </div>
                            <div class="notif-body" id="notifBody">
                                <!-- Notifications will be injected here -->
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <div class="content-wrapper">
                <div id="overview-section">
                    <h1 class="page-title">Dashboard Overview</h1>
                    
                    <!-- Metrics Grid -->
                <div class="metrics-grid-5">
                    <div class="metric-card">
                        <div class="metric-icon blue"><i class="fa-solid fa-users"></i></div>
                        <div class="metric-details">
                            <span class="metric-title">Total Leads</span>
                            <span class="metric-value" id="valTotalLeads">--</span>
                        </div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-icon green"><i class="fa-solid fa-fire"></i></div>
                        <div class="metric-details">
                            <span class="metric-title">Hot Leads</span>
                            <span class="metric-value" id="valHotLeads">--</span>
                        </div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-icon purple"><i class="fa-solid fa-message"></i></div>
                        <div class="metric-details">
                            <span class="metric-title">Active Chats</span>
                            <span class="metric-value" id="valActiveChats">--</span>
                        </div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-icon orange"><i class="fa-solid fa-chart-line"></i></div>
                        <div class="metric-details">
                            <span class="metric-title">Avg Score</span>
                            <span class="metric-value" id="valAvgScore">--</span>
                        </div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-icon teal"><i class="fa-solid fa-handshake"></i></div>
                        <div class="metric-details">
                            <span class="metric-title">Connected People</span>
                            <span class="metric-value" id="valConnectedPeople">--</span>
                        </div>
                    </div>
                </div>
                
                </div>

                </div> <!-- End of overview-section -->

                <!-- Leads Table -->
                <div class="table-container" id="leads-section">
                    <div class="table-header">
                        <h2>Recent Leads</h2>
                        <div class="table-actions">
                            <select id="chatFilter" class="glass-select" style="margin-right: 12px;">
                                <option value="all">All Chat Activity</option>
                                <option value="today">Active Today</option>
                                <option value="yesterday">Active Yesterday</option>
                            </select>
                            <select id="profileFilter" class="glass-select" style="margin-right: 12px;">
                                <option value="all">All Profiles</option>
                            </select>
                            <select id="statusFilter" class="glass-select">
                                <option value="all">All Statuses</option>
                                <option value="Extracted">Extracted</option>
                                <option value="Connected">Connected</option>
                                <option value="SQL">SQL</option>
                                <option value="Hot">Hot</option>
                                <option value="Warm">Warm</option>
                                <option value="Cold">Cold</option>
                            </select>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="leads-table">
                            <thead>
                                <tr>
                                    <th>Lead Info</th>
                                    <th>LinkedIn</th>
                                    <th>Status</th>
                                    <th>Profile</th>
                                    <th>AI Score</th>
                                    <th>Meeting Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="leadsTableBody">
                                <!-- Rows generated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="admin_app.js"></script>
    <script>
    </script>
</body>
</html>
