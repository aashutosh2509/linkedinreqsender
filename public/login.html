<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBE CRM - Security Lock</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #f4f6fa;
            --bg-secondary: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --accent-primary: #008eda;
            --accent-hover: #0077b5;
            --border-color: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-container {
            background-color: var(--bg-secondary);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .logo-container {
            margin-bottom: 24px;
        }

        .logo-container i {
            font-size: 48px;
            color: var(--accent-primary);
            margin-bottom: 16px;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: var(--text-primary);
        }

        p {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0 0 32px 0;
        }

        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 142, 218, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .error-message {
            color: #ef4444;
            background-color: #fef2f2;
            border: 1px solid #fee2e2;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            margin-bottom: 24px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-container">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h1>Security Lock</h1>
        <p>Please enter the administrative password to access the dashboards.</p>

        <div id="errorBox" class="error-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <input type="password" id="passwordInput" placeholder="Enter password..." required autofocus>
            </div>
            <button type="submit" class="btn-submit">Unlock Dashboard</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('passwordInput').value;
            const errorBox = document.getElementById('errorBox');
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (response.ok) {
                    errorBox.style.display = 'none';
                    // Check if there is a redirect parameter (optional, currently it will just go to index.html or admin)
                    // If they tried to access a specific page before being redirected, the browser might have it in referer
                    // Alternatively, we can just redirect to admin_dashboard.html by default
                    window.location.href = '/admin_dashboard.html';
                } else {
                    const data = await response.json();
                    errorBox.textContent = data.error || 'Invalid password.';
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                errorBox.textContent = 'A network error occurred.';
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
